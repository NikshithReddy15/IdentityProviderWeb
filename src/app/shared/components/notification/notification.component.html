<div class="notifications-wrapper" aria-live="polite" aria-atomic="true">
    @for (notification of notificationService.notifications(); track notification.id) {
    <div class="notification" [class]="getNotificationTypeClass(notification.type)">
        <i class="icon" [class]="getNotificationTypeIcon(notification.type)"></i>
        <div class="message">{{notification.message}}</div>
        <button class="close" (click)="dismiss(notification.id)"><i class="bi bi-x"></i></button>
    </div>
    }
</div>
